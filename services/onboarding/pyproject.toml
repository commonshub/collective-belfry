[project]
name = "belfry-onboarding"
version = "0.1.0"
description = "Belfry onboarding service: activates passes after payment, revokes on refund or dispute, expires passes"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "websockets>=13",
    "pyjwt[crypto]>=2.8",
    "segno>=1.6",
    "python-multipart>=0.0.9",
    "coincurve>=20",
    "icalendar>=6",
    "recurring-ical-events>=3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "anyio>=4",
    "ruff>=0.5",
]

[project.scripts]
belfry-onboarding = "belfry_onboarding.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["belfry_onboarding*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# inline HTML, CSS and JS of the claim, door and bridge pages
"belfry_onboarding/claim.py" = ["E501"]
"belfry_onboarding/bridge.py" = ["E501"]
"belfry_onboarding/mypass.py" = ["E501"]
"belfry_onboarding/feedback.py" = ["E501"]
"belfry_onboarding/apply.py" = ["E501"]
