[project]
name = "belfry-onboarding"
version = "0.1.0"
description = "Belfry onboarding service: activates passes after payment, revokes on refund or dispute, expires passes"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "websockets>=13",
    "pyjwt[crypto]>=2.8",
    "segno>=1.6",
    "python-multipart>=0.0.9",
    "coincurve>=20",
    "icalendar>=6",
    "recurring-ical-events>=3",
    "aiosmtpd>=1.4",
    "dkimpy>=1.1",
    "pyspf>=2.0.14",
    "dnspython>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "anyio>=4",
    "ruff>=0.5",
]

[project.scripts]
belfry-onboarding = "belfry_onboarding.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["belfry_onboarding*"]

[tool.setuptools.package-data]
belfry_onboarding = ["themes/**/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# inline HTML, CSS and JS of the claim, door and bridge pages
"belfry_onboarding/claim.py" = ["E501"]
"belfry_onboarding/bridge.py" = ["E501"]
"belfry_onboarding/mypass.py" = ["E501"]
"belfry_onboarding/feedback.py" = ["E501"]
"belfry_onboarding/apply.py" = ["E501"]
"belfry_onboarding/volunteer.py" = ["E501"]
"belfry_onboarding/community.py" = ["E501"]
"belfry_onboarding/theme.py" = ["E501"]
"belfry_onboarding/setup.py" = ["E501"]
"belfry_onboarding/gitview.py" = ["E501"]
"belfry_onboarding/connect.py" = ["E501"]
"belfry_onboarding/apps.py" = ["E501"]
"belfry_onboarding/sessions.py" = ["E501"]
"belfry_onboarding/followers.py" = ["E501"]
"belfry_onboarding/drops.py" = ["E501"]
"belfry_onboarding/passlogin.py" = ["E501"]
"tests/test_sessions.py" = ["E501"]
"tests/test_theme.py" = ["E501"]
"tests/test_setup.py" = ["E501"]
"tests/test_gitview.py" = ["E501"]
"tests/test_community.py" = ["E501"]
"belfry_onboarding/console.py" = ["E501"]
"tests/test_console.py" = ["E501"]
