# Belfry behind the host's nginx, port 80 (written by install.sh into
# /etc/nginx/sites-available/belfry, @@DOMAIN@@ replaced): Let's Encrypt's HTTP challenges go to
# Belfry's Caddy, which holds the certificates; everything else moves to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name @@DOMAIN@@ .@@DOMAIN@@;

    location /.well-known/acme-challenge/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
