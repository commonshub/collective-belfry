# Belfry behind the host's nginx (written by install.sh into /etc/nginx/stream.d/belfry.conf,
# @@DOMAIN@@ replaced). nginx does not decrypt Belfry's traffic: it reads the name the browser asks
# for (SNI, ssl_preread) and passes the connection on to Belfry's Caddy on 127.0.0.1:8443 with a
# PROXY protocol header, so Caddy keeps the visitor's own address (ADMIN_NETS, rate limits) and
# keeps its own Let's Encrypt certificates. infra/docker-compose.nginx.yml, proxy/Caddyfile.
#
# Another site on this server: give it a line below pointing to 127.0.0.1:8444 and let its
# server block listen with `listen 127.0.0.1:8444 ssl proxy_protocol;` and
# `real_ip_header proxy_protocol; set_real_ip_from 127.0.0.1;`.
map $ssl_preread_server_name $belfry_tls_upstream {
    hostnames;
    .@@DOMAIN@@        127.0.0.1:8443;
    default            127.0.0.1:8443;
}

server {
    listen 443;
    listen [::]:443;
    ssl_preread on;
    proxy_pass $belfry_tls_upstream;
    proxy_protocol on;
    proxy_connect_timeout 10s;
    # relays and the bunker keep websockets open
    proxy_timeout 1h;
}
