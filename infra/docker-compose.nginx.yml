# Behind the host's nginx (install.sh): a third file after docker-compose.prod.yml,
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml -f infra/docker-compose.nginx.yml
# The proxy publishes nothing on the public interfaces: Caddy listens on 8080 (ACME HTTP
# challenges) and 8443 (TLS, with the PROXY protocol) on the loopback only, and the host's nginx
# owns 80 and 443 (infra/nginx/). Docker's published ports bypass ufw, so loopback-only also
# keeps the firewall meaningful. proxy/Caddyfile has the matching listener on :8443.
name: belfry

services:
  proxy:
    ports: !override
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8443:8443"
    environment:
      CADDY_HTTP_PORT: "8080"
      CADDY_HTTPS_PORT: "8443"
