# Belfry Blossom server (hzrd149/blossom-server): photos and files of the community apps,
# content-addressed. Hardened as follows:
# - every write (upload, delete) needs a BUD-11 auth event (kind 24242) signed by the
#   uploader; blossom-server verifies the signature, and the gate in front of it
#   (blossom/Caddyfile -> onboarding /blossom/auth) additionally requires that the pubkey holds
#   an active pass. Reads are public (content-addressed, no listing).
# - no mirror (SSRF surface), no server-side media processing, no listing, no dashboard.
# - size limit and MIME allowlist with retention (media, documents, and web files for nsites).
port: 3000
host: 0.0.0.0
publicDomain: "${BLOSSOM_PUBLIC_DOMAIN}"

database:
  path: data/sqlite.db

storage:
  backend: local
  local:
    dir: ./data/blobs
  removeWhenNoOwners: true
  # MIME allowlist and retention (unaccessed blobs are pruned after the period).
  rules:
    - type: "image/*"
      expiration: 1 year
    - type: "video/mp4"
      expiration: 3 months
    - type: "video/webm"
      expiration: 3 months
    - type: "audio/*"
      expiration: 3 months
    - type: "application/pdf"
      expiration: 1 year
    - type: "text/plain"
      expiration: 1 year
    - type: "text/markdown"
      expiration: 1 year
    # websites published as nsites (NIP-5A; services/onboarding/belfry_onboarding/homepage.py):
    # kept for years, since the homepage serves them from its own cache and rarely reads them here.
    # The blob host serves everything sandboxed (proxy/Caddyfile), so HTML here runs nowhere.
    - type: "text/html"
      expiration: 5 years
    - type: "text/css"
      expiration: 5 years
    - type: "text/javascript"
      expiration: 5 years
    - type: "application/javascript"
      expiration: 5 years
    - type: "application/json"
      expiration: 5 years
    - type: "application/manifest+json"
      expiration: 5 years
    - type: "text/xml"
      expiration: 5 years
    - type: "application/xml"
      expiration: 5 years
    - type: "font/*"
      expiration: 5 years
    - type: "application/x-sh"
      expiration: 5 years
    - type: "application/wasm"
      expiration: 5 years

upload:
  enabled: true
  requireAuth: true
  maxSize: 26214400 # 25 MB
  workers: 1
  maxJobsPerWorker: 4
  requirePubkeyInRule: false # the gate checks the pass; rules stay MIME-only

mirror:
  enabled: false

delete:
  requireAuth: true

list:
  enabled: false

media:
  enabled: false

dashboard:
  enabled: false
