# OpenID4VCI issuer metadata (served at /.well-known/openid-credential-issuer/openid4vci).
# One credential type for every tier (plan: "One credential type, tier and dates are claims").
# BELFRY_VCT is the Type Metadata URL Belfry hosts (onboarding service, /vct/village-pass/v1).
# BELFRY_BRAND_URL: the brand/ folder as served by the onboarding service (logo for wallets).
issuerDisplay = [
  {
    name = "Open Source Village, run by Belfry"
    locale = "en"
    logo = {
      uri = "${BELFRY_BRAND_URL}/apple-touch-icon.png"
      alt_text = "Open Source Village"
    }
  }
]

credentialConfigurations = {
  "village_pass" = {
    format = "dc+sd-jwt"
    scope = "village_pass"
    vct = "${BELFRY_VCT}"
    credential_signing_alg_values_supported = ["ES256"]
    cryptographic_binding_methods_supported = ["jwk"]
    proof_types_supported = {
      jwt = {
        proof_signing_alg_values_supported = ["ES256"]
      }
    }
    credential_metadata = {
      display = [
        {
          name = "Open Source Village Pass"
          locale = "en"
          description = "Pass for Open Source Village, run by Belfry"
          background_color = "#2b3a31"
          text_color = "#FFFFFF"
          logo = {
            uri = "${BELFRY_BRAND_URL}/apple-touch-icon.png"
            alt_text = "Open Source Village"
          }
        }
      ]
      claims = [
        { path = ["pass_tier"],     display = [{ name = "Pass tier", locale = "en" }] }
        { path = ["display_name"],  display = [{ name = "Name", locale = "en" }] }
        { path = ["member_number"], display = [{ name = "Member number", locale = "en" }] }
        { path = ["npub"],          display = [{ name = "Nostr public key", locale = "en" }] }
      ]
    }
  }
}
