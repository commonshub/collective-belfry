# Belfry local stack (slice 1). See infra/README.md.
# Settings come from infra/.env, secrets from infra/secrets/ (both written by scripts/gen-secrets.sh).
name: belfry

# Secrets (2026-10-25): one file each in infra/secrets/, mounted as Compose secrets at
# /run/secrets/<name> into the containers that need them; none is an environment variable of a
# container (docker inspect shows none). The files are mode 640 with group 10001 (perms-init sets
# it at every start), and each container that reads one carries that group (group_add). Images
# that read secrets only from environment variables (Odoo, Keycast, the mint, authentik's first-
# start bootstrap) start through /belfry/with-secrets (secrets-env/with-secrets.sh), which
# exports the files named in SECRETS_ENV for that process alone. infra/README.md, "Secrets".
x-secret-group: &secret-group ["10001"]

# Images (2026-10-25): every image from a registry is pinned by digest to the build the smoke test
# ran against; the tag stays for the reader. Updating one: docker pull <tag>, run the smoke test,
# then put the new digest here (docker image inspect <tag> --format '{{index .RepoDigests 0}}').
x-with-secrets: &with-secrets ./secrets-env/with-secrets.sh:/belfry/with-secrets:ro

# Hardening (2026-10-24): no container gains privileges after start; the ones that start as a
# non-root user also drop every capability. Each has a process limit (pids_limit, against fork
# bombs and runaway workers), and Belfry's own services run with a read-only root file system. Images that start as root get the user 10001
# (APP_UID); perms-init hands the volumes they write to that user once. Keycast runs as the
# deploying user (HOST_UID, written by gen-secrets.sh), the owner of master.key and the custody
# seed. Web servers that listen on port 80 keep that one capability (caddy) or may bind it
# unprivileged (the sysctl below, nginx).
x-hardened: &hardened
  security_opt: ["no-new-privileges:true"]
  pids_limit: 1024
x-nonroot: &nonroot
  user: "10001:10001"
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  pids_limit: 1024
x-low-ports: &low-ports
  net.ipv4.ip_unprivileged_port_start: "0"

x-authentik-env: &authentik-env
  AUTHENTIK_POSTGRESQL__HOST: postgres
  AUTHENTIK_POSTGRESQL__NAME: authentik
  AUTHENTIK_POSTGRESQL__USER: authentik
  # authentik reads file:// values itself
  AUTHENTIK_POSTGRESQL__PASSWORD: file:///run/secrets/authentik_db_password
  AUTHENTIK_SECRET_KEY: file:///run/secrets/authentik_secret_key
  AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
  # The system blueprint /blueprints/system/bootstrap.yaml creates akadmin and a non-expiring API
  # token (identifier authentik-bootstrap-token) on first start; the worker gets the two values
  # AUTHENTIK_BOOTSTRAP_PASSWORD and AUTHENTIK_BOOTSTRAP_TOKEN through with-secrets.
  AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-akadmin@belfry.local}
  # The Belfry blueprints read their client secrets from /run/secrets (!File), the URLs here (!Env).
  # The pass bridge lives in the onboarding service.
  BELFRY_BRIDGE_PUBLIC_URL: ${ONBOARDING_PUBLIC_URL:-http://localhost:8100}/bridge
  BELFRY_BRIDGE_INTERNAL_URL: http://onboarding:8100/bridge
  # Read by the keycast-provider blueprint (!Env): redirect URI.
  KEYCAST_APP_URL: ${KEYCAST_APP_URL:-http://localhost:3000}
  # Read by the steward-app blueprint (!Env): the steward pages of the onboarding service.
  BELFRY_STEWARD_URL: ${ONBOARDING_PUBLIC_URL:-http://localhost:8100}/steward
  BELFRY_STEWARD_REDIRECT_URI: ${ONBOARDING_PUBLIC_URL:-http://localhost:8100}/steward/callback
  # Read by the pass-app blueprint (!Env): the pass on the phone (/me) of the onboarding service.
  BELFRY_PASS_PAGE_URL: ${ONBOARDING_PUBLIC_URL:-http://localhost:8100}/me
  BELFRY_PASS_PAGE_REDIRECT_URI: ${ONBOARDING_PUBLIC_URL:-http://localhost:8100}/me/callback
  # Read by the issuer-app blueprint (!Env): Issuer2's login for authorization-code offers.
  BELFRY_ISSUER_REDIRECT_URI: ${ISSUER_PUBLIC_URL:-http://localhost:7005}/openid4vci/external/oauth/callback
  # Read by the brand blueprint (!Env): logo, favicon, background and fonts come from the
  # repo's brand/ folder as served by the onboarding service (pass.<domain>/brand).
  BELFRY_BRAND_URL: ${ONBOARDING_PUBLIC_URL:-http://localhost:8100}/brand

# The community apps (Name|URL|Description;...): the cards on Keycast's dashboard and the links of
# the Open Source Village app bar (brand/osv-bar.js) in every app.
x-community-apps: &community-apps "Chat|${CHAT_PUBLIC_URL:-http://localhost:3300}|Private messages with other participants;Calendar|${CALENDAR_PUBLIC_URL:-http://localhost:3200}|The village's events and your own calendars;Vote|${VOTE_PUBLIC_URL:-http://localhost:3500}|Anonymous polls, one vote per pass;Wallet|${WALLET_PUBLIC_URL:-http://localhost:3400}|Your village tokens: receive and pass them on;Directory|${PEOPLE_PUBLIC_URL:-http://localhost:3600}|Who is here: the participants who chose to be listed;Market|${MARKET_PUBLIC_URL:-http://localhost:3700}|Offers between participants, paid in village tokens;Photos|${PHOTOS_PUBLIC_URL:-http://localhost:3800}|Pictures of the village, shared between participants;Programme|${PROGRAMME_PUBLIC_URL:-http://localhost:3900}|What is on now and next: the programme, the rooms, participants' sessions;Groups|${GROUPS_PUBLIC_URL:-http://localhost:3150}|Rooms for teams, topics and projects; anyone can open one;Help|${ONBOARDING_PUBLIC_URL:-http://localhost:8100}/help|Signing in, your pass, the apps, tokens, stewards;Feedback|${ONBOARDING_PUBLIC_URL:-http://localhost:8100}/feedback|Tell us what works and what does not"

x-keycast-env: &keycast-env
  # the password comes as PGPASSWORD (with-secrets), which sqlx uses when the URL has none
  DATABASE_URL: postgres://keycast@postgres:5432/keycast
  SECRETS_ENV: PGPASSWORD=keycast_db_password SERVER_NSEC=keycast_server_nsec KEYCAST_SERVICE_TOKEN=keycast_service_token OIDC_CLIENT_SECRET=keycast_oidc_client_secret PASS_INFO_TOKEN=pass_info_token BELFRY_HOOK_TOKEN=hook_token
  REDIS_URL: redis://redis:6379
  KMS_PROVIDER: file
  # Only checked for presence; the binary opens /app/master.key (see keycast/README.md).
  MASTER_KEY_PATH: /app/master.key
  ALLOWED_PUBKEYS: ${KEYCAST_ADMIN_PUBKEY:?}
  ALLOWED_ORIGINS: ${KEYCAST_APP_URL:-http://localhost:3000}
  # Tenant = Host header without port. Every caller (browser and onboarding service)
  # must present this host, otherwise Keycast answers 400 "Invalid domain".
  ALLOWED_TENANT_DOMAINS: ${KEYCAST_TENANT_DOMAIN:-localhost}
  BUNKER_RELAYS: ws://keycast-relay:8080
  # Belfry fork (patch 0007): the same relay as clients reach it, written into bunker:// URLs and
  # NIP-05 discovery; the signer keeps BUNKER_RELAYS. Host port 3080 locally, wss://bunker.<domain> in production.
  BUNKER_PUBLIC_RELAYS: ${BUNKER_PUBLIC_RELAYS:-ws://localhost:3080}
  APP_URL: ${KEYCAST_APP_URL:-http://localhost:3000}
  BASE_URL: ${KEYCAST_APP_URL:-http://localhost:3000}
  WEB_BUILD_DIR: /app/web
  NODE_ENV: development
  ENABLE_DEV_EMAIL_INBOX: "true"
  FROM_EMAIL: noreply@belfry.local
  FROM_NAME: Belfry
  RUST_LOG: ${KEYCAST_RUST_LOG:-info}
  PORT: "3000"
  # Belfry fork: sign-in through Authentik (infra/keycast/README.md, "The Belfry fork").
  # The issuer is the URL the browser sees; back-channel calls go to authentik-server with
  # that Host header, so the ID token's iss matches.
  OIDC_ISSUER: ${AUTHENTIK_PUBLIC_URL:-http://localhost:9000}/application/o/keycast/
  OIDC_CLIENT_ID: keycast
  OIDC_REDIRECT_URL: ${KEYCAST_APP_URL:-http://localhost:3000}/api/auth/oidc/callback
  OIDC_BACKCHANNEL_URL: http://authentik-server:9000
  OIDC_SCOPES: openid email profile keycast
  OIDC_LINK_CLAIM: keycast_vine_id
  OIDC_PROVIDER_NAME: Open Source Village
  OIDC_HIDE_PASSWORD_LOGIN: ${KEYCAST_OIDC_ONLY:-true}
  # Logout goes to the invalidation flow itself, not authentik's end-session view, which answers
  # an empty page while the browser holds an unfinished sign-in (Keycast patch 0013).
  OIDC_LOGOUT_URL: ${AUTHENTIK_PUBLIC_URL:-http://localhost:9000}/if/flow/belfry-signer-logout/
  # Belfry's own apps skip the consent screen and may sign in silently (prompt=none, patch 0008);
  # each must also be a registered client (bootstrap writes their redirect URIs).
  KEYCAST_TRUSTED_CLIENTS: ${KEYCAST_TRUSTED_CLIENTS:-belfry-chat,belfry-calendar,belfry-vote,belfry-wallet,belfry-people,belfry-market,belfry-photos,belfry-programme,belfry-groups}
  # Keycast patch 0011: the village wallet derives its backup seed and nutzap key from the
  # participant's key (HKDF per purpose); no other app may derive anything.
  KEYCAST_DERIVE_SECRETS: ${KEYCAST_DERIVE_SECRETS:-belfry-wallet:cashu-wallet-v1|cashu-nutzap-v1}
  # Belfry fork: the NIP-05 names shown on the dashboard live on the apex domain (the proxy
  # forwards its nostr.json to this tenant); same value as the onboarding service's.
  NIP05_DOMAIN: ${NIP05_DOMAIN:-localhost}
  # Belfry fork: the dashboard's "Your pass" card, from the onboarding service (internal network).
  BELFRY_PASS_INFO_URL: http://onboarding:8100
  # Keycast patch 0012: self-custody changes go to the onboarding service (pass npub, relay
  # whitelist), with the hook token like Odoo's hooks.
  KEYCAST_CUSTODY_SEED_FILE: /run/belfry/custody-seed
  BELFRY_KEY_CHANGED_URL: http://onboarding:8100/hooks/keycast/key-changed
  # Belfry fork (patch 0009): the dashboard's "Community apps" cards, Name|URL|Description;...
  BELFRY_COMMUNITY_APPS: *community-apps

services:
  postgres:
    image: postgres:16@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
    # starts as the image's postgres user directly (the data directory is its own), so the secret
    # group stays: the entrypoint's switch from root would drop it
    user: "999:999"
    security_opt: ["no-new-privileges:true"]
    pids_limit: 1024
    cap_drop: [ALL]
    group_add: *secret-group
    networks: [data]
    depends_on:
      perms-init:
        condition: service_completed_successfully
    # the role passwords are read by postgres/init.sh on the first start only
    secrets: [postgres_password, odoo_db_password, authentik_db_password, keycast_db_password,
              zooid_db_password]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-belfry.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres && psql -U postgres -tAc \"select 1 from pg_database where datname='keycast'\" | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m
          pids: 1024

  odoo:
    image: odoo:19@sha256:076562619a5de059388d9f9d90545cb575799c04869610a5b20839893819b41b
    entrypoint: ["/belfry/with-secrets", "/entrypoint.sh"]
    command: ["odoo"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 1024
    cap_drop: [ALL]
    group_add: *secret-group
    secrets: [odoo_db_password]
    networks: [default, data]
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["8069:8069"]
    environment:
      # The image entrypoint passes no --db_* args when PG* vars are set; libpq reads them.
      # That also makes `docker compose exec odoo odoo -d ...` work without extra arguments.
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: odoo
      # PGPASSWORD from the secret; commands run with exec need the wrapper as well:
      # docker compose exec odoo /belfry/with-secrets odoo ...
      SECRETS_ENV: PGPASSWORD=odoo_db_password
    volumes:
      - *with-secrets
      - odoo-data:/var/lib/odoo
      - ./odoo/odoo.conf:/etc/odoo/odoo.conf:ro
      - ../odoo/addons:/mnt/extra-addons:ro
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8069/web/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 2g
          pids: 1024

  # Local mail sink: Odoo's outgoing mail server points here (bootstrap, SMTP_* in .env).
  # Web UI and API on http://localhost:8025; production replaces it with a real SMTP relay.
  mailpit:
    image: axllent/mailpit:latest@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    <<: *nonroot
    ports: ["8025:8025"]
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 10

  authentik-server:
    image: ghcr.io/goauthentik/server:2026.8.5@sha256:602227a86455d6772e3d16b7d852713c4f864f40df5df894abd1285bb53979a5
    command: server
    security_opt: ["no-new-privileges:true"]
    pids_limit: 1024
    cap_drop: [ALL]
    group_add: *secret-group
    secrets: [authentik_db_password, authentik_secret_key]
    networks: [default, data]
    depends_on:
      postgres:
        condition: service_healthy
    environment: *authentik-env
    ports: ["9000:9000"]
    shm_size: 512mb
    volumes:
      - authentik-media:/media
      - ./authentik/blueprints:/blueprints/custom:ro
      # Custom e-mail templates (belfry/magic_link.html for the magic-link stage).
      - ./authentik/templates:/templates:ro
      # The PNG authentik attaches to every mail as cid:logo (stages/email/utils.py).
      - ../brand/osv-logo-horizontal-dark.png:/web/dist/assets/icons/icon_left_brand.png:ro
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.8.5@sha256:602227a86455d6772e3d16b7d852713c4f864f40df5df894abd1285bb53979a5
    # the bootstrap values exist for authentik only as environment variables (core/setup)
    entrypoint: ["/belfry/with-secrets", "dumb-init", "--", "ak"]
    command: worker
    security_opt: ["no-new-privileges:true"]
    pids_limit: 1024
    cap_drop: [ALL]
    group_add: *secret-group
    secrets: [authentik_db_password, authentik_secret_key, authentik_bootstrap_password,
              authentik_bootstrap_token, bridge_client_secret, keycast_oidc_client_secret,
              steward_oidc_client_secret, pass_page_oidc_client_secret, issuer_oidc_client_secret]
    networks: [default, data]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *authentik-env
      SECRETS_ENV: AUTHENTIK_BOOTSTRAP_PASSWORD=authentik_bootstrap_password AUTHENTIK_BOOTSTRAP_TOKEN=authentik_bootstrap_token
    shm_size: 512mb
    volumes:
      - *with-secrets
      - authentik-media:/media
      - authentik-certs:/certs
      - ./authentik/blueprints:/blueprints/custom:ro
      - ./authentik/templates:/templates:ro
      - ../brand/osv-logo-horizontal-dark.png:/web/dist/assets/icons/icon_left_brand.png:ro
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  redis:
    image: redis:7@sha256:44960b3100c48159a66d28c18b0588c193492e25f7551d60e51dd464fc3eca5b
    <<: *hardened
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: the volumes written by images that used to run as root belong to APP_UID 10001
  # (chown only where needed, so a restart costs nothing), and the secret files (infra/secrets/,
  # the rendered issuer and verifier configs with their keys) get group 10001 and mode 640, so
  # only the containers with that group read them. Runs as root with only the capabilities chown
  # and chmod need.
  perms-init:
    image: busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    entrypoint: ["sh", "-c", "for d in /v/*; do [ \"$$(stat -c %u $$d)\" = 10001 ] || chown -R 10001:10001 $$d; done; for f in /s/secrets/* /s/issuer-config/issuer2-profiles.conf /s/issuer-config/issuer-service.conf /s/issuer-config/authentication-service.conf /s/verifier-config/verifier-service.conf /s/issuer-keys/issuer.jwk.json /s/issuer-keys/bridge.jwk.json /s/issuer-keys/eudi/wrpac.jwk.json; do [ -f $$f ] && chgrp 10001 $$f && chmod 640 $$f; done; true"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 1024
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH, FOWNER]
    network_mode: none
    volumes:
      - mint-data:/v/mint
      - blossom-data:/v/blossom
      - relay-data:/v/keycast-relay
      - ./secrets:/s/secrets
      - ./issuer/config:/s/issuer-config
      - ./issuer/keys:/s/issuer-keys
      - ./verifier/config:/s/verifier-config
    restart: "no"

  keycast-relay:
    image: ghcr.io/verse-pbc/relay_builder:latest@sha256:3af9ecda55c8bf06c3b18450c60257f13b881d593a4c37fd742c3efdb2027584
    <<: *nonroot
    depends_on:
      perms-init:
        condition: service_completed_successfully
    environment:
      IDLE_TIMEOUT: "0"
      # The relay's own URL as clients reach it. NIP-42 AUTH events name it in their relay tag,
      # and the relay refuses one for another URL ("Relay URL mismatch", the calendar's
      # volunteered AUTH). Default was ws://localhost:8080, the container port.
      RELAY_URL: ${BUNKER_PUBLIC_RELAYS:-ws://localhost:3080}
    ports: ["3080:8080"]
    volumes:
      - relay-data:/data

  # Community relay (Phase 2): rnostr with NIP-42 and a pubkey whitelist for REQ and EVENT.
  # The config lives in the community-relay-config volume: relay-init seeds it from
  # relay/rnostr.toml once, then the onboarding service rewrites it from that template with the
  # pubkeys of all active passes and rnostr (--watch) reloads it. See relay/README.md.
  relay-init:
    image: rnostr/rnostr:latest@sha256:c022e4384f8fe1eb6023d497fe0c5cf9cd13d239f62160713546de4522f69214
    security_opt: ["no-new-privileges:true"]
    pids_limit: 1024
    cap_drop: [ALL]
    # A fresh volume is populated with the image's default rnostr.toml, so test for the Belfry
    # marker rather than for the file.
    entrypoint: ["sh", "-c", "grep -q belfry:whitelist /rnostr/config/rnostr.toml 2>/dev/null || cp /template/rnostr.toml /rnostr/config/rnostr.toml"]
    volumes:
      - community-relay-config:/rnostr/config
      - ./relay/rnostr.toml:/template/rnostr.toml:ro
    restart: "no"

  relay:
    image: rnostr/rnostr:latest@sha256:c022e4384f8fe1eb6023d497fe0c5cf9cd13d239f62160713546de4522f69214
    security_opt: ["no-new-privileges:true"]
    pids_limit: 1024
    cap_drop: [ALL]
    # The image's CMD already is: relay --watch -c ./config/rnostr.toml
    depends_on:
      relay-init:
        condition: service_completed_successfully
    ports: ["3090:8080"]
    volumes:
      - community-relay-config:/rnostr/config
      - community-relay-data:/rnostr/data
    healthcheck:
      # No curl in the image; a TCP connect to the listener is enough.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256m
          pids: 1024

  # One-shot: the keycast binary does not run migrations at startup and the image
  # entrypoint only knows unified/keycast/web, so the entrypoint is overridden.
  # The image is built from keycast/build/Dockerfile (clones divinevideo/keycast @ fe9c6460;
  # a plain git build context fails on upstream's broken submodule entry). ~15 min cold.
  keycast-migrate:
    image: belfry-keycast:local
    build:
      context: ./keycast/build
    entrypoint: ["/belfry/with-secrets", "/app/keycast", "--migrate"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    security_opt: ["no-new-privileges:true"]
    pids_limit: 1024
    cap_drop: [ALL]
    group_add: *secret-group
    secrets: [keycast_db_password]
    networks: [default, data]
    volumes:
      - *with-secrets
    environment:
      DATABASE_URL: postgres://keycast@postgres:5432/keycast
      SECRETS_ENV: PGPASSWORD=keycast_db_password
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  keycast:
    image: belfry-keycast:local
    build:
      context: ./keycast/build
    entrypoint: ["/belfry/with-secrets", "/usr/local/bin/docker-entrypoint.sh"]
    command: ["unified"]
    # the owner of master.key and the custody seed (scripts/custody-seed.sh unlock)
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    security_opt: ["no-new-privileges:true"]
    pids_limit: 1024
    cap_drop: [ALL]
    group_add: *secret-group
    secrets: [keycast_db_password, keycast_server_nsec, keycast_service_token,
              keycast_oidc_client_secret, pass_info_token, hook_token]
    networks: [default, data]
    # Keycast's graceful shutdown (pre-drain 15 s, HTTP drain, signer drain) ends with leaving the
    # signer hashring in Redis. Docker's default 10 s would kill it during the pre-drain, the dead
    # instance would stay in the ring for 30 s and NIP-46 requests hashed to it would be dropped
    # silently until then (seen 2026-10-23). Clients retry, but give it time to leave cleanly.
    stop_grace_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycast-migrate:
        condition: service_completed_successfully
    environment: *keycast-env
    ports: ["3000:3000"]
    volumes:
      - *with-secrets
      - ./keycast/master.key:/app/master.key:ro
      # Keycast patch 0014: the custody seed participant keys derive from. Locally a file written
      # by gen-secrets.sh; on a deployment CUSTODY_SEED_DIR=/run/belfry (memory only), filled by a
      # steward with infra/scripts/custody-seed.sh unlock. Missing seed: new accounts wait (503).
      - ${CUSTODY_SEED_DIR:-./secrets/custody}:/run/belfry:ro
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  # Phase 3: walt.id Issuer2 issues the village-pass SD-JWT VC (OpenID4VCI, pre-authorized code).
  # Config: issuer/config (the two *.conf files with key material are rendered there by gen-issuer-pki.sh).
  # Port 7005 is the wallet-facing API; the management API (/issuer2/*) on the same port has no
  # authentication: block it at the reverse proxy in production.
  issuer:
    image: waltid/issuer-api2:1.2.0@sha256:95dbdb98560af5fbd3511a21e3c928d86550c2990ca40dd81ba7ab99aec81b92
    <<: *nonroot
    depends_on:
      perms-init:
        condition: service_completed_successfully
    environment:
      ISSUER_PUBLIC_URL: ${ISSUER_PUBLIC_URL:-http://localhost:7005}
      BELFRY_VCT: ${ONBOARDING_PUBLIC_URL:-http://localhost:8100}/vct/village-pass/v1
      BELFRY_BRAND_URL: ${ONBOARDING_PUBLIC_URL:-http://localhost:8100}/brand
    ports: ["7005:7005"]
    volumes:
      - ./issuer/config:/waltid-issuer-api2/config:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:7005/.well-known/openid-credential-issuer/openid4vci >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g
          pids: 1024

  # Phase 3: walt.id Verifier2 checks presentations (door page and pass bridge create sessions
  # through http://verifier:7004; wallets use VERIFIER_PUBLIC_URL).
  verifier:
    image: waltid/verifier-api2:1.2.0@sha256:2e8581019531c2efa17a2c086b9c76ee7fee4bb5ee68369e2ea1864733039e9a
    <<: *nonroot
    depends_on:
      perms-init:
        condition: service_completed_successfully
    environment:
      VERIFIER_PUBLIC_URL: ${VERIFIER_PUBLIC_URL:-http://localhost:7004}
    ports: ["7004:7004"]
    volumes:
      - ./verifier/config:/waltid-verifier-api2/config:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:7004/transaction-data-profiles >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g
          pids: 1024

  # Phase 2: Blossom file server (photos, files) for the community apps. Internal; reached only
  # through blossom-gate, which asks the onboarding service whether the uploader holds an active
  # pass. Image pinned by digest (the project has no releases). See blossom/config.yml.
  blossom:
    image: ghcr.io/hzrd149/blossom-server@sha256:2b23ba053b4e1ba780504e3c4b6d7057b545e51bfb2cfc034d5093e5d0c10ff3
    <<: *nonroot
    depends_on:
      perms-init:
        condition: service_completed_successfully
    environment:
      BLOSSOM_REQUIRE_CONFIG: "1"
      BLOSSOM_PUBLIC_DOMAIN: ${BLOSSOM_PUBLIC_DOMAIN:-localhost:3100}
    volumes:
      - ./blossom/config.yml:/app/config.yml:ro
      - blossom-data:/app/data
    healthcheck:
      # The image has neither wget nor curl; a TCP connect to the listener is enough.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512m
          pids: 1024

  # Village tokens (decision 2026-10-24): a Cashu mint (cdk-mintd) whose tokens have no monetary
  # value: fake payment backend, unit "osv". The onboarding service mints 50 tokens per pass day
  # at activation over the internal network; the production proxy (mint.<domain>) denies
  # /v1/mint/* and /v1/melt/*, so participants can only pass tokens on (swap). Locally the host
  # port is the mint itself, minting included. infra/mint/README.md.
  mint:
    image: cashubtc/mintd:0.18.2@sha256:60695eb06750ede23e38975d354f0f83827e9441e568c281ec748cee503fb914
    <<: *nonroot
    depends_on:
      perms-init:
        condition: service_completed_successfully
    entrypoint: ["/config/entrypoint.sh"]
    secrets: [mint_seed]
    environment:
      MINT_PUBLIC_URL: ${MINT_PUBLIC_URL:-http://localhost:3338}
      BELFRY_BRAND_URL: ${ONBOARDING_PUBLIC_URL:-http://localhost:8100}/brand
      MINT_UNIT: osv
    ports: ["3338:8085"]
    volumes:
      - ./mint:/config:ro
      - mint-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8085/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  blossom-gate:
    image: caddy:2@sha256:504a44d7d74bd2bc28a66afc4774912fc21223ca8a67734af1c54ab2f999b489
    profiles: ["app"]
    <<: *nonroot
    # caddy's binary carries the file capability to bind port 80; keep it in the bounding set
    cap_add: [NET_BIND_SERVICE]
    tmpfs: ["/config:uid=10001", "/data:uid=10001"]
    ports: ["3100:80"]
    volumes:
      - ./blossom/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      blossom:
        condition: service_healthy
      onboarding:
        condition: service_healthy

  # Community chat (NIP-17): Coracle at a pinned commit with Belfry's relays and the OSV look
  # compiled in; participants sign in with "Sign in with Open Source Village" (Keycast OAuth, silent
  # when already signed in) or a bunker URL from the apps dashboard. infra/apps/chat/README.md.
  chat:
    image: belfry-chat:local
    build:
      context: ./apps/chat
      additional_contexts:
        brand: ../brand
      args:
        CHAT_PUBLIC_URL: ${CHAT_PUBLIC_URL:-http://localhost:3300}
        COMMUNITY_RELAY_URL: ${COMMUNITY_RELAY_URL:-ws://localhost:3090}
        BUNKER_PUBLIC_RELAYS: ${BUNKER_PUBLIC_RELAYS:-ws://localhost:3080}
        BLOSSOM_PUBLIC_URL: ${BLOSSOM_PUBLIC_URL:-http://localhost:3100}
        KEYCAST_APP_URL: ${KEYCAST_APP_URL:-http://localhost:3000}
        COMMUNITY_APPS: *community-apps
    profiles: ["app"]
    # nginx as its own unprivileged user (it owns its pid and temp directories in the image).
    # Browser-only: no backend access.
    user: "100:101"
    security_opt: ["no-new-privileges:true"]
    pids_limit: 1024
    cap_drop: [ALL]
    sysctls: *low-ports
    networks: [edge]
    ports: ["3300:80"]

  # Belfry's glue. Behind the "app" profile so the rest of the stack starts before
  # services/onboarding exists: `docker compose --profile app up -d` once it does.
  onboarding:
    build: ../services/onboarding
    profiles: ["app"]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 1024
    cap_drop: [ALL]
    # settings.py reads every secret from /run/secrets (pydantic secrets_dir)
    group_add: *secret-group
    secrets: [odoo_api_key, authentik_token, keycast_admin_token, keycast_service_token,
              bridge_client_secret, hook_token, steward_oidc_client_secret, steward_session_secret,
              pass_page_oidc_client_secret, pass_page_secret, pass_info_token, stripe_webhook_secret,
              programme_nsec, groups_api_nsec]
    depends_on:
      odoo:
        condition: service_healthy
      authentik-server:
        condition: service_healthy
      keycast:
        condition: service_healthy
      relay:
        condition: service_healthy
      issuer:
        condition: service_healthy
      verifier:
        condition: service_healthy
    ports: ["8100:8100"]
    volumes:
      - community-relay-config:/relay-config
      - ./relay/rnostr.toml:/relay-template/rnostr.toml:ro
      - ./issuer/keys/issuer.jwk.json:/keys/issuer.jwk.json:ro
      - ./issuer/keys/issuer.x5c.json:/keys/issuer.x5c.json:ro
      - ./issuer/keys/bridge.jwk.json:/keys/bridge.jwk.json:ro
      # The EUDI registrar's access and registration certificates (eudi-registry-certs.sh); may be empty.
      - ./issuer/keys/eudi:/keys/eudi:ro
      # Open Source Village brand assets, served at /brand (pages, authentik, issuer, wallets).
      - ../brand:/brand:ro
    environment:
      BRAND_DIR: /brand
      ODOO_URL: http://odoo:8069
      ODOO_DB: odoo
      ODOO_USER: ${ODOO_ONBOARDING_LOGIN:-onboarding@belfry.local}
      AUTHENTIK_URL: http://authentik-server:9000
      # Authentik as the browser sees it: the account-setup links mailed at activation use it.
      AUTHENTIK_PUBLIC_URL: ${AUTHENTIK_PUBLIC_URL:-http://localhost:9000}
      AUTHENTIK_SOURCE_SLUG: pass-bridge
      KEYCAST_URL: http://keycast:3000
      # Send this as the Host header to Keycast (tenant = Host).
      KEYCAST_TENANT_DOMAIN: ${KEYCAST_TENANT_DOMAIN:-localhost}
      # Community relay: profiles, follow and relay lists are published here; the whitelist is rendered from
      # the template into the shared config volume (rnostr reloads it).
      RELAY_URL: ws://relay:8080
      # The same relay as clients reach it: written into the participants' relay lists.
      COMMUNITY_RELAY_URL: ${COMMUNITY_RELAY_URL:-ws://localhost:3090}
      RELAY_CONFIG_PATH: /relay-config/rnostr.toml
      RELAY_CONFIG_TEMPLATE: /relay-template/rnostr.toml
      RELAY_EXTRA_PUBKEYS: ${RELAY_EXTRA_PUBKEYS:-}
      POLLS_PUBKEY: ${POLLS_PUBKEY:-}
      # the groups relay's member API (groups_members.py); empty turns the member sync off
      GROUPS_API_URL: ${GROUPS_API_URL-http://groups-relay:3334}
      # sync-programme (programme.py): empty URL disables that source
      PROGRAMME_SCHEDULE_URL: ${PROGRAMME_SCHEDULE_URL-https://opensourcevillage.org/schedule.json}
      PROGRAMME_ROOMS_URL: ${PROGRAMME_ROOMS_URL-https://raw.githubusercontent.com/commonshub/commonshub.brussels/main/src/settings/rooms.json}
      PROGRAMME_SLOTS: ${PROGRAMME_SLOTS:-morning=09:30-12:30,afternoon=14:00-18:00,evening=18:30-21:30}
      NIP05_DOMAIN: ${NIP05_DOMAIN:-localhost}
      # Blossom gate: hostnames a BUD-11 "server" tag may name (comma-separated), empty = any.
      BLOSSOM_HOSTS: ${BLOSSOM_PUBLIC_DOMAIN:-localhost:3100}
      # Phase 3: credentials (issuer management API, verifier sessions, status list, bridge).
      ISSUER_URL: http://issuer:7005
      ISSUER_PUBLIC_URL: ${ISSUER_PUBLIC_URL:-http://localhost:7005}
      VERIFIER_URL: http://verifier:7004
      PUBLIC_URL: ${ONBOARDING_PUBLIC_URL:-http://localhost:8100}
      MINT_URL: http://mint:8085
      MINT_PUBLIC_URL: ${MINT_PUBLIC_URL:-http://localhost:3338}
      WALLET_PUBLIC_URL: ${WALLET_PUBLIC_URL:-http://localhost:3400}
      # Links on the landing page at pass.<domain>/: the account page and the community apps.
      APPS_PUBLIC_URL: ${KEYCAST_APP_URL:-http://localhost:3000}
      CHAT_PUBLIC_URL: ${CHAT_PUBLIC_URL:-http://localhost:3300}
      CALENDAR_PUBLIC_URL: ${CALENDAR_PUBLIC_URL:-http://localhost:3200}
      STATUS_LIST_URL: ${STATUS_LIST_URL:-http://onboarding:8100/status/1}
      STATUS_LIST_TTL: ${STATUS_LIST_TTL:-300}
      ISSUER_JWK_PATH: /keys/issuer.jwk.json
      ISSUER_X5C_PATH: /keys/issuer.x5c.json
      BRIDGE_JWK_PATH: /keys/bridge.jwk.json
      EUDI_DIR: /keys/eudi
      BRIDGE_CLIENT_ID: belfry-authentik
      EVENT_START: ${EVENT_START:-2027-01-25}
      SITE_URL: ${SITE_URL:-}
      TEST_RUN_NOTICE: ${TEST_RUN_NOTICE:-}
      EVENT_END: ${EVENT_END:-2027-01-31}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # The help page (/help) lists the community apps (the app bar's list).
      COMMUNITY_APPS: *community-apps
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:8100/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  # Community app: the Open Source Village calendar (Calendar by Form*, NIP-52), a static build
  # (infra/apps/calendar). The relay and brand URLs are baked in at build time: rebuild the image
  # after changing COMMUNITY_RELAY_URL, BUNKER_PUBLIC_RELAYS or ONBOARDING_PUBLIC_URL.
  calendar:
    profiles: ["app"]
    image: belfry-calendar:local
    build:
      context: ..
      dockerfile: infra/apps/calendar/Dockerfile
      args:
        VITE_TEST_RELAY: ${COMMUNITY_RELAY_URL:-ws://localhost:3090}
        VITE_SIGNER_RELAYS: ${BUNKER_PUBLIC_RELAYS:-ws://localhost:3080}
        VITE_BRAND_URL: ${ONBOARDING_PUBLIC_URL:-http://localhost:8100}/brand
        VITE_APPS_URL: ${KEYCAST_APP_URL:-http://localhost:3000}
        VITE_KEYCAST_URL: ${KEYCAST_APP_URL:-http://localhost:3000}
        VITE_COMMUNITY_APPS: *community-apps
        VITE_PROGRAMME_PUBKEY: ${PROGRAMME_PUBKEY:-}
        VITE_PROGRAMME_URL: ${PROGRAMME_PUBLIC_URL:-http://localhost:3900}
    # static files only: no backend access
    <<: *nonroot
    # caddy's binary carries the file capability to bind port 80; keep it in the bounding set
    cap_add: [NET_BIND_SERVICE]
    tmpfs: ["/config:uid=10001", "/data:uid=10001"]
    networks: [edge]
    ports: ["3200:80"]

  # Village token wallet: cashu.me with the village mint built in, "Sign in with Open Source
  # Village" (keys derived from the participant's Nostr key, Keycast patch 0011) and nutzaps over
  # the community relay. infra/apps/wallet/README.md.
  wallet:
    profiles: ["app"]
    image: belfry-wallet:local
    build:
      context: ..
      dockerfile: infra/apps/wallet/Dockerfile
      args:
        BELFRY_MINT_URL: ${MINT_PUBLIC_URL:-http://localhost:3338}
        BELFRY_KEYCAST_URL: ${KEYCAST_APP_URL:-http://localhost:3000}
        BELFRY_COMMUNITY_RELAY: ${COMMUNITY_RELAY_URL:-ws://localhost:3090}
        BELFRY_PASS_URL: ${ONBOARDING_PUBLIC_URL:-http://localhost:8100}
        APPS_URL: ${KEYCAST_APP_URL:-http://localhost:3000}
        COMMUNITY_APPS: *community-apps
    # static files only: no backend access
    <<: *nonroot
    # caddy's binary carries the file capability to bind port 80; keep it in the bounding set
    cap_add: [NET_BIND_SERVICE]
    tmpfs: ["/config:uid=10001", "/data:uid=10001"]
    networks: [edge]
    ports: ["3400:80"]

  # Anonymous polls (Semaphore): one vote per active pass and poll, any participant opens polls.
  # API and web app in one Node process at vote.<domain>; the electorate comes from the
  # onboarding service. services/vote/README.md.
  vote:
    profiles: ["app"]
    image: belfry-vote:local
    read_only: true
    tmpfs: ["/tmp"]
    build:
      context: ..
      dockerfile: services/vote/Dockerfile
      args:
        VITE_KEYCAST_URL: ${KEYCAST_APP_URL:-http://localhost:3000}
        VITE_APPS_URL: ${KEYCAST_APP_URL:-http://localhost:3000}
        VITE_BRAND_URL: ${ONBOARDING_PUBLIC_URL:-http://localhost:8100}/brand
        VITE_COMMUNITY_APPS: *community-apps
        VITE_PROGRAMME_URL: ${PROGRAMME_PUBLIC_URL:-http://localhost:3900}
    environment:
      PUBLIC_URL: ${VOTE_PUBLIC_URL:-http://localhost:3500}
      ONBOARDING_URL: http://onboarding:8100
      TREE_DEPTH: "10"
      # polls and results as notes of the polls key (POLLS_NSEC) on the community relay
      RELAY_URL: ws://relay:8080
      COMMUNITY_RELAY_URL: ${COMMUNITY_RELAY_URL:-ws://localhost:3090}
    # PASS_INFO_TOKEN and POLLS_NSEC from /run/secrets
    group_add: *secret-group
    secrets: [pass_info_token, polls_nsec]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 1024
    cap_drop: [ALL]
    volumes:
      - vote-data:/data
    ports: ["3500:8080"]

  # The directory (people.<domain>, opt-in profiles), the marketplace (market.<domain>, NIP-99
  # offers paid in village tokens through the wallet), the photos (photos.<domain>, NIP-68
  # pictures on Blossom) and the programme (programme.<domain>, NIP-52 sessions with RSVPs and
  # comments): browser apps on the community relay, one Node process serving all four on four
  # ports. services/village/README.md.
  village:
    profiles: ["app"]
    image: belfry-village:local
    read_only: true
    tmpfs: ["/tmp"]
    build:
      context: ..
      dockerfile: services/village/Dockerfile
      args:
        VITE_KEYCAST_URL: ${KEYCAST_APP_URL:-http://localhost:3000}
        VITE_RELAY_URL: ${COMMUNITY_RELAY_URL:-ws://localhost:3090}
        VITE_BLOSSOM_URL: ${BLOSSOM_PUBLIC_URL:-http://localhost:3100}
        VITE_CHAT_URL: ${CHAT_PUBLIC_URL:-http://localhost:3300}
        VITE_WALLET_URL: ${WALLET_PUBLIC_URL:-http://localhost:3400}
        VITE_PEOPLE_URL: ${PEOPLE_PUBLIC_URL:-http://localhost:3600}
        VITE_MARKET_URL: ${MARKET_PUBLIC_URL:-http://localhost:3700}
        VITE_PHOTOS_URL: ${PHOTOS_PUBLIC_URL:-http://localhost:3800}
        VITE_CALENDAR_URL: ${CALENDAR_PUBLIC_URL:-http://localhost:3200}
        VITE_PROGRAMME_URL: ${PROGRAMME_PUBLIC_URL:-http://localhost:3900}
        VITE_PROGRAMME_PUBKEY: ${PROGRAMME_PUBKEY:-}
        VITE_VOTE_URL: ${VOTE_PUBLIC_URL:-http://localhost:3500}
        VITE_POLLS_PUBKEY: ${POLLS_PUBKEY:-}
        VITE_APPS_URL: ${KEYCAST_APP_URL:-http://localhost:3000}
        VITE_BRAND_URL: ${ONBOARDING_PUBLIC_URL:-http://localhost:8100}/brand
        VITE_COMMUNITY_APPS: *community-apps
    environment:
      PEOPLE_PUBLIC_URL: ${PEOPLE_PUBLIC_URL:-http://localhost:3600}
      MARKET_PUBLIC_URL: ${MARKET_PUBLIC_URL:-http://localhost:3700}
      PHOTOS_PUBLIC_URL: ${PHOTOS_PUBLIC_URL:-http://localhost:3800}
      PROGRAMME_PUBLIC_URL: ${PROGRAMME_PUBLIC_URL:-http://localhost:3900}
      # other apps that read the programme's participants and hidden list (CORS): the calendar
      PROGRAMME_CORS_ORIGINS: ${CALENDAR_PUBLIC_URL:-http://localhost:3200}
      ONBOARDING_URL: http://onboarding:8100
    # PASS_INFO_TOKEN from /run/secrets/pass_info_token
    group_add: *secret-group
    secrets: [pass_info_token]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 1024
    cap_drop: [ALL]
    ports: ["3600:8080", "3700:8081", "3800:8082", "3900:8083"]

  # The groups relay (groups-relay.<domain>): zooid with NIP-29 groups, members = active passes
  # (the onboarding service syncs them over zooid's NIP-98 member API on the internal host
  # name), every member may open a group. infra/groups-relay/README.md.
  groups-relay:
    profiles: ["app"]
    image: belfry-groups-relay:local
    build: ./groups-relay
    user: "10001:10001"
    read_only: true
    tmpfs: ["/app/config:uid=10001", "/app/media:uid=10001", "/tmp"]
    environment:
      GROUPS_RELAY_URL: ${GROUPS_RELAY_URL:-ws://localhost:3190}
      GROUPS_API_PUBKEY: ${GROUPS_API_PUBKEY:?run scripts/gen-secrets.sh}
      GROUPS_BRAND_ICON: ${ONBOARDING_PUBLIC_URL:-http://localhost:8100}/brand/apps/groups-192.png
    group_add: *secret-group
    secrets: [groups_relay_nsec, zooid_db_password]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 1024
    cap_drop: [ALL]
    networks: [default, data]
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["3190:3334"]

  # The groups app (groups.<domain>): Flotilla in platform mode on the groups relay, "Sign in
  # with Open Source Village" through Keycast. infra/apps/groups/README.md.
  groups:
    image: belfry-groups:local
    build:
      context: ./apps/groups
      additional_contexts:
        brand: ../brand
      args:
        GROUPS_PUBLIC_URL: ${GROUPS_PUBLIC_URL:-http://localhost:3150}
        GROUPS_RELAY_URL: ${GROUPS_RELAY_URL:-ws://localhost:3190}
        COMMUNITY_RELAY_URL: ${COMMUNITY_RELAY_URL:-ws://localhost:3090}
        BUNKER_PUBLIC_RELAYS: ${BUNKER_PUBLIC_RELAYS:-ws://localhost:3080}
        BLOSSOM_PUBLIC_URL: ${BLOSSOM_PUBLIC_URL:-http://localhost:3100}
        KEYCAST_APP_URL: ${KEYCAST_APP_URL:-http://localhost:3000}
        # "No pass yet? Ask for an invite" links here (the start page)
        SITE_URL: ${SITE_URL:-${ONBOARDING_PUBLIC_URL:-http://localhost:8100}}
        COMMUNITY_APPS: *community-apps
    profiles: ["app"]
    # nginx as its own unprivileged user, like the chat. Browser-only: no backend access.
    user: "100:101"
    security_opt: ["no-new-privileges:true"]
    pids_limit: 1024
    cap_drop: [ALL]
    sysctls: *low-ports
    networks: [edge]
    ports: ["3150:80"]

# default: service to service. data (internal, no internet): Postgres and Redis with their
# clients only. edge: what only the browser reaches (the static apps; the production proxy).
networks:
  default:
  data:
    internal: true
  edge:

# The secret files (scripts/gen-secrets.sh, bootstrap.sh); see the note at the top.
secrets:
  postgres_password: {file: ./secrets/postgres_password}
  odoo_db_password: {file: ./secrets/odoo_db_password}
  authentik_db_password: {file: ./secrets/authentik_db_password}
  keycast_db_password: {file: ./secrets/keycast_db_password}
  odoo_api_key: {file: ./secrets/odoo_api_key}
  authentik_secret_key: {file: ./secrets/authentik_secret_key}
  authentik_bootstrap_password: {file: ./secrets/authentik_bootstrap_password}
  authentik_bootstrap_token: {file: ./secrets/authentik_bootstrap_token}
  authentik_token: {file: ./secrets/authentik_token}
  bridge_client_secret: {file: ./secrets/bridge_client_secret}
  keycast_oidc_client_secret: {file: ./secrets/keycast_oidc_client_secret}
  steward_oidc_client_secret: {file: ./secrets/steward_oidc_client_secret}
  steward_session_secret: {file: ./secrets/steward_session_secret}
  pass_page_oidc_client_secret: {file: ./secrets/pass_page_oidc_client_secret}
  pass_page_secret: {file: ./secrets/pass_page_secret}
  programme_nsec: {file: ./secrets/programme_nsec}
  polls_nsec: {file: ./secrets/polls_nsec}
  groups_relay_nsec: {file: ./secrets/groups_relay_nsec}
  groups_api_nsec: {file: ./secrets/groups_api_nsec}
  zooid_db_password: {file: ./secrets/zooid_db_password}
  issuer_oidc_client_secret: {file: ./secrets/issuer_oidc_client_secret}
  keycast_server_nsec: {file: ./secrets/keycast_server_nsec}
  keycast_service_token: {file: ./secrets/keycast_service_token}
  keycast_admin_token: {file: ./secrets/keycast_admin_token}
  hook_token: {file: ./secrets/hook_token}
  pass_info_token: {file: ./secrets/pass_info_token}
  mint_seed: {file: ./secrets/mint_seed}
  stripe_webhook_secret: {file: ./secrets/stripe_webhook_secret}

volumes:
  blossom-data:
  vote-data:
  mint-data:
  postgres:
  odoo-data:
  authentik-media:
  authentik-certs:
  relay-data:
  community-relay-config:
  community-relay-data:
