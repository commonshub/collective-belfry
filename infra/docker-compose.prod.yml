# Production overlay: docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml
# Adds the Caddy reverse proxy (TLS, one hostname per service, see proxy/Caddyfile) and stops
# publishing the services' own ports; everything reaches them through the proxy or the Compose
# network. Public URLs in .env must point at the proxy hostnames (scripts/prod-env.sh).
name: belfry

services:
  proxy:
    # Caddy with the rate-limit module (proxy/Dockerfile), as an unprivileged user
    image: belfry-proxy:local
    build: ./proxy
    restart: unless-stopped
    user: "10001:10001"
    security_opt: ["no-new-privileges:true"]
    pids_limit: 1024
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    networks:
      # The proxy's published ports go to its edge address. edge has IPv6, so Docker forwards
      # IPv6 like IPv4 (ip6tables) and the proxy sees every visitor's own address; without it
      # IPv6 visitors came through Docker's userland proxy as the bridge address 172.18.0.1,
      # which broke per-IP limits and would have let them past the admin allowlist.
      edge:
        gw_priority: 1
      default:
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      BELFRY_DOMAIN: ${BELFRY_DOMAIN:?set BELFRY_DOMAIN (scripts/prod-env.sh)}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
      CADDY_TLS_ARG: ${CADDY_TLS_ARG:-${ACME_EMAIL}}
      KEYCAST_TENANT_DOMAIN: ${KEYCAST_TENANT_DOMAIN:-localhost}
      ODOO_HOST_PREFIX: ${ODOO_HOST_PREFIX:-shop}
      # Admin pages (Odoo back office, Authentik admin, /steward) only from these networks: the
      # ZeroTier subnet and the VM itself (bootstrap and smoke run there). infra/DEPLOY.md.
      ADMIN_NETS: ${ADMIN_NETS:-127.0.0.1/8 172.16.0.0/12}
      # The venue WiFi's public addresses (space-separated CIDRs), exempt from the rate limits; the
      # default is a documentation address, i.e. no exemption.
      RATE_LIMIT_EXEMPT: ${RATE_LIMIT_EXEMPT:-192.0.2.1/32}
    volumes:
      # the directory, not the file: a git update replaces the Caddyfile (new inode), which a
      # single-file mount would never show; `caddy reload` then picks up the new one
      - ./proxy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      perms-init:
        condition: service_completed_successfully
      odoo:
        condition: service_started
      authentik-server:
        condition: service_started
      keycast:
        condition: service_started
      relay:
        condition: service_started
      issuer:
        condition: service_started
      verifier:
        condition: service_started

  # the proxy's certificates and state belong to its user as well
  perms-init:
    volumes:
      - caddy-data:/v/caddy-data
      - caddy-config:/v/caddy-config

  odoo:

    ports: !reset []
    restart: unless-stopped
  mailpit:
    # No local mail sink in production: SMTP_* point at a real relay. Only started with the
    # "dev" profile; remove a running one with `docker compose rm -sf mailpit`.
    profiles: ["dev"]
    ports: !reset []
  authentik-server:
    ports: !reset []
    restart: unless-stopped
  authentik-worker:
    restart: unless-stopped
  keycast:
    ports: !reset []
    restart: unless-stopped
    environment:
      # Behind the proxy Keycast talks to Authentik over the public HTTPS hostname: through the
      # Compose network Authentik only sees plain HTTP and publishes an http:// issuer, which
      # Keycast rejects against OIDC_ISSUER (seen on the first deployment, 2026-10-23).
      OIDC_BACKCHANNEL_URL: ""
  keycast-relay:
    ports: !reset []
    restart: unless-stopped
  relay:
    ports: !reset []
    restart: unless-stopped
  blossom:
    restart: unless-stopped
  blossom-gate:
    ports: !reset []
    restart: unless-stopped
  chat:
    ports: !reset []
    restart: unless-stopped
  mint:
    ports: !reset []
    restart: unless-stopped
  wallet:
    ports: !reset []
    restart: unless-stopped
  issuer:
    ports: !reset []
    restart: unless-stopped
  verifier:
    ports: !reset []
    restart: unless-stopped
  onboarding:
    ports: !reset []
    restart: unless-stopped
  calendar:
    ports: !reset []
    restart: unless-stopped
  vote:
    ports: !reset []
    restart: unless-stopped
  village:
    ports: !reset []
    restart: unless-stopped
  groups-relay:
    ports: !reset []
    restart: unless-stopped
  groups:
    ports: !reset []
    restart: unless-stopped
  postgres:
    restart: unless-stopped
  redis:
    restart: unless-stopped

networks:
  edge:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd42:be1f:7ed9::/64

volumes:
  caddy-data:
  caddy-config:
