# Belfry: the pass on the phone (/me in the onboarding service, decided 2026-10-24): a participant
# signed in to Authentik shows the pass as a renewing QR code at the door, no wallet needed.
# OAuth2/OIDC provider + application for the onboarding service, participants only, implicit
# consent, so a participant already signed in reaches the page without a click. The "keycast"
# scope (belfry-keycast-provider.yaml) carries the Odoo partner id the page looks the pass up by.
# Applied by the worker's file watcher; bootstrap re-applies it (client secret from the env).
version: 1
metadata:
  name: belfry-pass-app
  labels:
    blueprints.goauthentik.io/description: "Pass page (/me): OIDC provider and application for participants"
context:
  redirect_uri: !Env [BELFRY_PASS_PAGE_REDIRECT_URI, "http://localhost:8100/me/callback"]
  pass_url: !Env [BELFRY_PASS_PAGE_URL, "http://localhost:8100/me"]
  client_secret: !Env [PASS_PAGE_OIDC_CLIENT_SECRET, "placeholder-set-PASS_PAGE_OIDC_CLIENT_SECRET"]
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: belfry-pass-oidc
    identifiers:
      name: belfry-pass-oidc
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      # authentik 2026.8 leaves grant_types empty for blueprint-created providers
      grant_types: [authorization_code]
      client_id: belfry-pass
      client_secret: !Context client_secret
      redirect_uris:
        - matching_mode: strict
          url: !Context redirect_uri
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      issuer_mode: per_provider
      sub_mode: hashed_user_id
      access_code_validity: minutes=1
      access_token_validity: minutes=5
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, belfry-keycast-scope]]

  - model: authentik_core.application
    id: belfry-pass-app
    identifiers:
      slug: belfry-pass
    attrs:
      name: Your Open Source Village pass
      provider: !KeyOf belfry-pass-oidc
      meta_launch_url: !Context pass_url
      policy_engine_mode: any

  # Participants with an active pass only (the onboarding service keeps the group in sync).
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf belfry-pass-app
      group: !Find [authentik_core.group, [name, belfry-participants]]
    attrs:
      order: 0
      enabled: true
