# Belfry: Keycast signs in through authentik (decision 2026-10-22, "Keycast trusts Authentik via
# OIDC"). An OAuth2/OIDC provider + application for the Keycast fork's upstream login
# (api/src/api/http/oidc.rs in the fork, infra/keycast/patches/).
# Applied by the worker's file watcher (bind mount /blueprints/custom); re-applied on change.
#
# Keycast maps the authentik user to its preloaded account through the "keycast" scope: the
# claim keycast_vine_id is "odoo-partner-<id>", the same vine_id the onboarding service passes to
# POST /api/admin/preload-user. Only members of belfry-participants may use the application.
#
# Issuer (per provider): <authentik public URL>/application/o/keycast/
version: 1
metadata:
  name: belfry-keycast-provider
  labels:
    blueprints.goauthentik.io/description: "OIDC provider and application for the Keycast signer login"
context:
  keycast_url: !Env [KEYCAST_APP_URL, "http://localhost:3000"]
  client_secret: !File /run/secrets/keycast_oidc_client_secret
entries:
  # 1. Scope "keycast": the link claim. Absent (no claim) for users without an Odoo partner id,
  #    which Keycast answers with "no signing account".
  - model: authentik_providers_oauth2.scopemapping
    id: belfry-keycast-scope
    identifiers:
      name: belfry-keycast-scope
    attrs:
      scope_name: keycast
      description: "Your Belfry signing account"
      expression: |
        partner_id = request.user.attributes.get("odoo_partner_id")
        if not partner_id:
            return {}
        return {"keycast_vine_id": f"odoo-partner-{partner_id}"}

  # 1b. Logout (Belfry, Keycast patch 0010): Keycast's /api/auth/oidc/logout sends the browser to
  #     this provider's end-session endpoint. The invalidation flow really ends the authentik
  #     session (authentik's default provider invalidation flow only says "you've logged out of
  #     <app>"), then returns to Keycast, which sends the participant back to the app. Without
  #     this, an app's silent sign-in would sign the participant straight back in.
  - model: authentik_stages_user_logout.userlogoutstage
    id: belfry-signer-logout-stage
    identifiers:
      name: belfry-signer-logout
  - model: authentik_stages_redirect.redirectstage
    id: belfry-signer-logout-return
    identifiers:
      name: belfry-signer-logout-return
    attrs:
      mode: static
      target_static: !Format ["%s/api/auth/oidc/logged-out", !Context keycast_url]
      keep_context: false
  - model: authentik_flows.flow
    id: belfry-signer-logout-flow
    identifiers:
      slug: belfry-signer-logout
    attrs:
      name: Sign out of Open Source Village
      title: Signing you out of Open Source Village
      designation: invalidation
      authentication: none
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf belfry-signer-logout-flow
      stage: !KeyOf belfry-signer-logout-stage
      order: 0
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf belfry-signer-logout-flow
      stage: !KeyOf belfry-signer-logout-return
      order: 10

  # 2. The provider. Confidential client; Keycast sends PKCE S256 as well.
  - model: authentik_providers_oauth2.oauth2provider
    id: belfry-keycast-oidc
    identifiers:
      name: belfry-keycast-oidc
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !KeyOf belfry-signer-logout-flow
      client_type: confidential
      # authentik 2026.8 leaves grant_types empty for blueprint-created providers, and the
      # authorize endpoint then refuses every request ("Invalid grant_type for provider").
      grant_types: [authorization_code]
      client_id: keycast
      client_secret: !Context client_secret
      redirect_uris:
        - matching_mode: strict
          url: !Format ["%s/api/auth/oidc/callback", !Context keycast_url]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      include_claims_in_id_token: true
      issuer_mode: per_provider
      sub_mode: hashed_user_id
      access_code_validity: minutes=1
      access_token_validity: minutes=5
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !KeyOf belfry-keycast-scope

  # 3. The application (slug = the issuer path segment).
  - model: authentik_core.application
    id: belfry-keycast-app
    identifiers:
      slug: keycast
    attrs:
      name: Belfry signer (Keycast)
      provider: !KeyOf belfry-keycast-oidc
      meta_launch_url: !Context keycast_url
      policy_engine_mode: any

  # 4. Participants only.
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf belfry-keycast-app
      group: !Find [authentik_core.group, [name, belfry-participants]]
    attrs:
      order: 0
      enabled: true
