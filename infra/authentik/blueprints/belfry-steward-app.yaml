# Belfry: the steward pages (/steward in the onboarding service, decided 2026-10-23: stewards
# work in Belfry's own UI, Odoo stays the backend and is used by admins and accounting only).
# An OAuth2/OIDC provider + application for the onboarding service, and the group belfry-stewards
# that alone may use it. Stewards sign in like participants (magic link or pass, the brand's
# authentication flow); `python -m belfry_onboarding add-steward <e-mail> <name>` creates the
# Authentik user if needed and adds it to the group.
# Applied by the worker's file watcher (bind mount /blueprints/custom); re-applied on change.
#
# The onboarding service exchanges the code server to server (client secret + PKCE) and reads the
# user from the userinfo endpoint, so it does not depend on the issuer the ID token carries.
version: 1
metadata:
  name: belfry-steward-app
  labels:
    blueprints.goauthentik.io/description: "Steward pages: OIDC provider and application, group belfry-stewards"
context:
  redirect_uri: !Env [BELFRY_STEWARD_REDIRECT_URI, "http://localhost:8100/steward/callback"]
  steward_url: !Env [BELFRY_STEWARD_URL, "http://localhost:8100/steward"]
  client_secret: !Env [STEWARD_OIDC_CLIENT_SECRET, "placeholder-set-STEWARD_OIDC_CLIENT_SECRET"]
entries:
  - model: authentik_core.group
    id: belfry-stewards
    identifiers:
      name: belfry-stewards
    attrs:
      is_superuser: false

  - model: authentik_providers_oauth2.oauth2provider
    id: belfry-steward-oidc
    identifiers:
      name: belfry-steward-oidc
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      # authentik 2026.8 leaves grant_types empty for blueprint-created providers (see
      # belfry-keycast-provider.yaml).
      grant_types: [authorization_code]
      client_id: belfry-steward
      client_secret: !Context client_secret
      redirect_uris:
        - matching_mode: strict
          url: !Context redirect_uri
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      issuer_mode: per_provider
      sub_mode: hashed_user_id
      access_code_validity: minutes=1
      access_token_validity: minutes=5
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_core.application
    id: belfry-steward-app
    identifiers:
      slug: belfry-steward
    attrs:
      name: Belfry stewards
      provider: !KeyOf belfry-steward-oidc
      meta_launch_url: !Context steward_url
      policy_engine_mode: any

  # Stewards only: everyone else is refused at the authorize step.
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf belfry-steward-app
      group: !KeyOf belfry-stewards
    attrs:
      order: 0
      enabled: true
