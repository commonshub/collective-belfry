# Belfry: the one-time sign-in link mailed at activation (Phase 2, 2026-10-23; passwordless since
# the magic-link decision of the same day, blueprint belfry-magic-link-flow).
#
# Participants are created by the onboarding service without a password and never get one. At
# activation the service asks authentik for a recovery link for the user (POST
# /api/v3/core/users/<pk>/recovery/, which plans the brand's recovery flow for that user and wraps
# the plan in a one-time flow token), stores it on the pass, and Odoo mails it ("Sign in to
# Belfry"). Opening the link runs this flow with the user already pending and signs the browser
# in; nothing else. A later link for the same user replaces the earlier token. Later sign-ins go
# through the login page's magic link (belfry-magic-link) or the pass.
#
# Deliberately minimal: no identification or e-mail stage, so the flow only does something when
# opened through such a link (a direct visit ends in "no pending user"). The slug stays
# belfry-account-setup (bootstrap, the smoke test and the onboarding service refer to it).
# Applied by the worker's file watcher (bind mount /blueprints/custom); re-applied on change.
version: 1
metadata:
  name: belfry-account-setup-flow
  labels:
    blueprints.goauthentik.io/description: "One-time sign-in link sent at activation (no password)"
entries:
  - model: authentik_flows.flow
    id: belfry-account-setup
    identifiers:
      slug: belfry-account-setup
    attrs:
      name: Open Source Village sign-in link
      title: Sign in to Open Source Village
      designation: recovery
      # "none", not require_unauthenticated: a participant who is already signed in (magic link)
      # and opens the activation link again should simply be signed in, not shown "denied".
      # The session becomes the token's user either way.
      authentication: none
      denied_action: message_continue
      compatibility_mode: true

  # The password step of the first version is gone (deleting a stage deletes its bindings).
  - model: authentik_stages_prompt.promptstage
    state: absent
    identifiers:
      name: belfry-account-setup-password
  - model: authentik_stages_user_write.userwritestage
    state: absent
    identifiers:
      name: belfry-account-setup-write
  - model: authentik_policies_password.passwordpolicy
    state: absent
    identifiers:
      name: belfry-password-policy
  - model: authentik_stages_prompt.prompt
    state: absent
    identifiers:
      name: belfry-setup-field-password
  - model: authentik_stages_prompt.prompt
    state: absent
    identifiers:
      name: belfry-setup-field-password-repeat

  - model: authentik_stages_user_login.userloginstage
    id: belfry-account-setup-login
    identifiers:
      name: belfry-account-setup-login
    attrs:
      # signed in for 14 days without asking "Stay signed in?" (the answer is always yes)
      session_duration: days=14
      remember_me_offset: seconds=0
  - model: authentik_flows.flowstagebinding
    id: belfry-account-setup-login-binding
    identifiers:
      target: !KeyOf belfry-account-setup
      stage: !KeyOf belfry-account-setup-login
      order: 30
    attrs:
      # the policy below runs again in the browser's request, where the link's query is known
      re_evaluate_policies: true

  # Back to the app after paying (2026-11-01): the welcome page signs the payer in with this flow
  # and adds belfry_return=<the order's return_url> to the link (onboarding signin.py). authentik
  # follows an absolute URL at the end of a flow only from the plan's "redirect" context, which
  # only a policy can set; ?next= must be relative. Without the parameter nothing changes: the
  # flow ends on the brand's default application, the apps page. The URL was checked against the
  # API's allowed origins when the order was placed; here only http(s) is required.
  - model: authentik_policies_expression.expressionpolicy
    id: belfry-account-setup-return
    identifiers:
      name: belfry-account-setup-return
    attrs:
      expression: |
        from urllib.parse import parse_qs, urlsplit
        query = request.http_request.GET.get("query", "") if request.http_request else ""
        target = (parse_qs(query).get("belfry_return") or [""])[0]
        parts = urlsplit(target)
        plan = request.context.get("flow_plan")
        if plan is not None and parts.scheme in ("https", "http") and parts.netloc:
            plan.context["redirect"] = target
        return True
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf belfry-account-setup-login-binding
      policy: !KeyOf belfry-account-setup-return
    attrs:
      order: 0

  # The recovery-link API uses the recovery flow of the brand matching the request host, falling
  # back to the default brand. The seed brand is not always flagged default (seen on a fresh
  # 2026.8.5 install behind a proxy), so it is pinned here; Belfry runs one brand.
  - model: authentik_brands.brand
    identifiers:
      domain: authentik-default
    attrs:
      default: true
      flow_recovery: !KeyOf belfry-account-setup
