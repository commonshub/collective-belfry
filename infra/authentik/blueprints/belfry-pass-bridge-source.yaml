# Belfry: the OpenID4VP-to-OIDC bridge as an authentik OpenID Connect source (pass sign-in),
# plus the participants group. From docs/research/authentik-spike.md (authentik 2026.8.5).
# Applied by the worker's file watcher (bind mount /blueprints/custom); re-applied on change.
#
# The bridge is part of the onboarding service (/bridge/*, Phase 3, 2026-10-23): the browser is
# sent to its public URL for the QR page, token and userinfo are fetched through the Compose
# network. The URLs are given explicitly instead of oidc_well_known_url, because authentik
# fetches the well-known document when the blueprint is applied and the onboarding service may
# not be up yet. The slug "pass-bridge" must stay.
version: 1
metadata:
  name: belfry-pass-bridge-source
  labels:
    blueprints.goauthentik.io/description: "Village pass sign-in via the OpenID4VP-to-OIDC bridge, participants group"
context:
  bridge_public: !Env [BELFRY_BRIDGE_PUBLIC_URL, "http://localhost:8100/bridge"]
  bridge_internal: !Env [BELFRY_BRIDGE_INTERNAL_URL, "http://onboarding:8100/bridge"]
  bridge_client_id: belfry-authentik
  bridge_client_secret: !File [/run/secrets/bridge_client_secret, "placeholder-set-BRIDGE_CLIENT_SECRET"]
entries:
  # 1. Group that activated participants are added to. Users get path belfry/participants.
  - model: authentik_core.group
    id: belfry-participants
    identifiers:
      name: belfry-participants
    attrs:
      is_superuser: false
      attributes:
        belfry.path: belfry/participants

  # 2. Property mapping: copy bridge claims into user attributes, never into identity fields.
  - model: authentik_sources_oauth.oauthsourcepropertymapping
    id: belfry-pass-claims
    identifiers:
      name: belfry-pass-claims
    attrs:
      expression: |
        # `info` is the bridge's userinfo payload: sub = member number, preferred_username = the
        # Authentik username (member number lowercased), npub, pass_tier. email and name are nulled
        # so the user_write stage never rewrites them; username stays, because username_link
        # matching needs it (and it equals the existing username anyway). None values are dropped.
        attrs = {"pass_bridge_sub": info.get("sub")}
        if info.get("npub"):
            attrs["npub"] = info["npub"]
        return {"email": None, "name": None, "attributes": attrs}

  # 3. The source itself. username_link + no enrollment flow: the first pass login links the
  #    source to the existing user with username = preferred_username (the member number), later
  #    logins match the link (identifier = bridge sub = member number). Nobody is ever created.
  #    The bridge only accepts passes Belfry issued, so a username match is a Belfry statement.
  - model: authentik_sources_oauth.oauthsource
    id: pass-bridge
    identifiers:
      slug: pass-bridge
    attrs:
      name: Village pass (EUDI wallet)
      enabled: true
      promoted: true
      provider_type: openidconnect
      consumer_key: !Context bridge_client_id
      consumer_secret: !Context bridge_client_secret
      authorization_url: !Format ["%s/authorize", !Context bridge_public]
      access_token_url: !Format ["%s/token", !Context bridge_internal]
      profile_url: !Format ["%s/userinfo", !Context bridge_internal]
      pkce: S256
      authorization_code_auth_method: basic_auth
      user_matching_mode: username_link
      group_matching_mode: identifier
      enrollment_flow: null
      authentication_flow: !Find [authentik_flows.flow, [slug, default-source-authentication]]
      user_property_mappings:
        - !KeyOf belfry-pass-claims

  # 4. Show the source on the login page.
  - model: authentik_stages_identification.identificationstage
    identifiers:
      name: default-authentication-identification
    attrs:
      sources:
        - !KeyOf pass-bridge

  # 5. Persist mapped attributes (pass_bridge_sub, npub) on every source login.
  - model: authentik_stages_user_write.userwritestage
    id: belfry-source-auth-write
    identifiers:
      name: belfry-source-auth-write
    attrs:
      user_creation_mode: never_create
      create_users_as_inactive: false
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-source-authentication]]
      stage: !KeyOf belfry-source-auth-write
      order: -10
