# Belfry: participants sign in by magic link, never with a password (decided 2026-10-23).
#
# The brand's authentication flow (the login page, and every OIDC authorize request, Keycast's
# "Sign in with Belfry" included): enter the e-mail address, authentik mails a one-time link
# (10 minutes), opening it signs the browser in and continues where the login started. The pass
# sign-in (source pass-bridge) is offered on the same page. Unknown addresses get authentik's
# "Failed to authenticate." and no mail is sent (no mail to arbitrary addresses; the price is that
# the page tells whether an address has an account).
#
# The link continues the flow in the browser that opens it. For an OIDC login (Keycast) it has to
# be the browser where the login started, because the app's own state cookie lives there.
#
# SMTP: the e-mail stage does not use authentik's global settings; bootstrap.sh writes host, port,
# user, password (infra/secrets/smtp_password) and sender into the stage over the API. Those
# fields are left out here so that re-applying the blueprint never resets them.
#
# Mail flooding (2026-10-24): a deny stage before the e-mail stage stops a sixth sign-in link for
# the same account within 30 minutes (expression policy belfry-magic-link-limit, counted in
# authentik's cache). Keyed on the account, not the IP: at the event most participants share the
# venue's address. Unknown addresses never get a mail anyway. If the policy cannot be evaluated,
# the deny stage is skipped and the e-mail stage still runs, so a fault never signs anyone in.
#
# Admins: akadmin keeps authentik's default-authentication-flow with a password, reachable at
# /if/flow/default-authentication-flow/?next=/if/admin/ (that flow is not changed here).
# Applied by the worker's file watcher (bind mount /blueprints/custom); re-applied on change.
version: 1
metadata:
  name: belfry-magic-link-flow
  labels:
    blueprints.goauthentik.io/description: "Participant login: e-mail magic link, or the village pass"
entries:
  # The pass-bridge source must exist before the identification stage can list it.
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: belfry-pass-bridge-source
      required: true

  - model: authentik_flows.flow
    id: belfry-magic-link
    identifiers:
      slug: belfry-magic-link
    attrs:
      name: Open Source Village sign-in
      title: Sign in to Open Source Village
      designation: authentication
      authentication: none
      denied_action: message_continue
      compatibility_mode: true

  - model: authentik_stages_identification.identificationstage
    id: belfry-magic-link-identification
    identifiers:
      name: belfry-magic-link-identification
    attrs:
      user_fields: [email]
      case_insensitive_matching: true
      pretend_user_exists: false
      show_matched_user: false
      password_stage: null
      enrollment_flow: null
      recovery_flow: null
      sources:
        - !Find [authentik_sources_oauth.oauthsource, [slug, pass-bridge]]
  - model: authentik_stages_email.emailstage
    id: belfry-magic-link-email
    identifiers:
      name: belfry-magic-link-email
    attrs:
      use_global_settings: false
      activate_user_on_success: false
      token_expiry: minutes=10
      subject: Your Open Source Village sign-in link
      template: belfry/magic_link.html
  - model: authentik_stages_deny.denystage
    id: belfry-magic-link-limit-deny
    identifiers:
      name: belfry-magic-link-limit-deny
    attrs:
      deny_message: Too many sign-in links were sent for this address. Try again in 30 minutes.
  - model: authentik_policies_expression.expressionpolicy
    id: belfry-magic-link-limit
    identifiers:
      name: belfry-magic-link-limit
    attrs:
      execution_logging: false
      # True (deny) from the sixth link for one account within 30 minutes.
      expression: |
        from django.core.cache import cache
        user = request.context.get("pending_user")
        if not user or not getattr(user, "pk", None):
            return False
        key = f"belfry-magic-link-{user.pk}"
        cache.add(key, 0, 1800)
        try:
            count = cache.incr(key)
        except ValueError:
            cache.set(key, 1, 1800)
            count = 1
        return count > 5
  - model: authentik_stages_user_login.userloginstage
    id: belfry-magic-link-login
    identifiers:
      name: belfry-magic-link-login
    attrs:
      session_duration: seconds=0
      remember_me_offset: days=14

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf belfry-magic-link
      stage: !KeyOf belfry-magic-link-identification
      order: 10
  - model: authentik_flows.flowstagebinding
    id: belfry-magic-link-limit-binding
    identifiers:
      target: !KeyOf belfry-magic-link
      stage: !KeyOf belfry-magic-link-limit-deny
      order: 15
    attrs:
      # decided when the stage is reached (the pending user is known then), not at planning
      evaluate_on_plan: false
      re_evaluate_policies: true
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf belfry-magic-link-limit-binding
      policy: !KeyOf belfry-magic-link-limit
    attrs:
      order: 0
      enabled: true
      # a failing expression counts as "no" (the deny stage is skipped, the mail stage still runs)
      failure_result: false
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf belfry-magic-link
      stage: !KeyOf belfry-magic-link-email
      order: 20
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf belfry-magic-link
      stage: !KeyOf belfry-magic-link-login
      order: 30

  - model: authentik_brands.brand
    identifiers:
      domain: authentik-default
    attrs:
      flow_authentication: !KeyOf belfry-magic-link
